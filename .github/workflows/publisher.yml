name: Cloud publisher

# Posts that are due go out from here, so the laptop does not have to be on at posting time.
# It only publishes clips that are already rendered. It never picks, downloads, transcribes or renders.
# GitHub may start a scheduled run 5-30 minutes late, so a post can go out a little after its set time.
# Scheduled runs are paused by GitHub after 60 days without any activity in the repository.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Never two publishers at once.
concurrency:
  group: cloud-publisher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'AnuragNagare/Snipster'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install
        working-directory: backend
        run: pip install --quiet -r requirements-publisher.txt

      - name: Publish due posts
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTHCHECK_CLOUD_URL: ${{ secrets.HEALTHCHECK_CLOUD_URL }}
        run: python -m app.cloud_publisher
