name: Download test

# Manual test only: can a GitHub runner fetch a Creative Commons YouTube video with yt-dlp?
# Uses no secrets. Prints no secrets. Delete this file once the real pipeline workflow exists.
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video id (a Creative Commons video)"
        default: "AvikGCepgNY"

jobs:
  try-download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Tool versions
        run: |
          python3 --version
          ffmpeg -version | head -1
          node --version
          python3 -m pip install --quiet --upgrade yt-dlp
          yt-dlp --version
          echo "runner ip block: $(curl -s https://ipinfo.io/org || echo unknown)"

      - name: Try each YouTube client mode
        run: |
          URL="https://www.youtube.com/watch?v=${{ inputs.video_id }}"
          : > results.txt
          for MODE in default "youtube:player_client=tv" "youtube:player_client=mweb" "youtube:player_client=android_vr" "youtube:player_client=web_safari"; do
            ARGS=()
            if [ "$MODE" != "default" ]; then ARGS=(--extractor-args "$MODE"); fi
            rm -f clip_test.*
            # 30 seconds from the middle of the video, not the whole file
            if yt-dlp "${ARGS[@]}" --no-warnings --no-progress --js-runtimes node \
                 -f "bv*[height<=720]+ba/b[height<=720]" --download-sections "*60-90" \
                 --force-keyframes-at-cuts -o "clip_test.%(ext)s" "$URL" > log.txt 2>&1; then
              SIZE=$(ls -l clip_test.* 2>/dev/null | head -1 | awk '{print $5}')
              DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 clip_test.* 2>/dev/null | head -1)
              echo "mode=$MODE RESULT=OK size=${SIZE}B duration=${DUR}s" | tee -a results.txt
            else
              REASON=$(grep -iE "ERROR|Sign in|bot|HTTP Error|unavailable" log.txt | head -2 | tr '\n' ' ' | cut -c1-240)
              echo "mode=$MODE RESULT=FAIL reason=$REASON" | tee -a results.txt
            fi
          done

      - name: Summary
        run: |
          {
            echo "## Download test for ${{ inputs.video_id }}"
            echo '```'
            cat results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q "RESULT=OK" results.txt; then echo "VERDICT: download works from GitHub runners"; else echo "VERDICT: download BLOCKED from GitHub runners"; fi
