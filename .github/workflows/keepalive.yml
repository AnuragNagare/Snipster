name: Keep alive

# GitHub pauses scheduled workflows in a public repository after 60 days without repository activity.
# Once a month this makes one tiny commit so the cloud publisher keeps running. (GitHub does not promise that
# a bot commit counts as activity; the cloud publisher's dead-man's-switch alerts if the pings stop anyway.)
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    if: github.repository == 'AnuragNagare/Snipster'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Record the date and commit it
        run: |
          date -u +"last keep-alive: %Y-%m-%d %H:%M UTC" > .github/keepalive.txt
          git config user.name "snipster-keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: monthly keep-alive" || echo "nothing to commit"
          git push
